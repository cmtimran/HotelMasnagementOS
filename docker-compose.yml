version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL 16 - Enterprise ACID Relational Database (1NF-4NF, RLS)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: hotel_pms_postgres
    restart: always
    environment:
      POSTGRES_DB: hotel_pms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/database/schema.postgres.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hotel_pms"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Redis 7 - Distributed Redlock & Pub/Sub Multi-Terminal Cluster Bus
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: hotel_pms_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # 3. Ollama AI Vision Engine - High-Security Local KYC Model Daemon
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: hotel_pms_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Server with NVIDIA GPU acceleration (Uncomment if GPU is available on host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ============================================================================
  # 4. Ollama Zero-Touch Auto-Provisioner (Compiles 'hotel-id-extractor')
  # Runs once at startup, pulls base vision model, compiles Modelfile, then exits cleanly
  # ============================================================================
  ollama-init:
    image: ollama/ollama:latest
    container_name: hotel_pms_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./Modelfile:/Modelfile:ro
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "=========================================================="
        echo ">> [Ollama Init] Checking models in repository..."
        if ollama list | grep -q "hotel-id-extractor"; then
          echo ">> [Ollama Init] Custom model 'hotel-id-extractor' is already installed!"
        else
          echo ">> [Ollama Init] Pulling base model 'llama3.2-vision'..."
          ollama pull llama3.2-vision
          echo ">> [Ollama Init] Compiling 'hotel-id-extractor' from /Modelfile..."
          ollama create hotel-id-extractor -f /Modelfile
          echo ">> [Ollama Init] Custom AI KYC model built successfully!"
        fi
        echo ">> [Ollama Init] Ready models:"
        ollama list
        echo "=========================================================="
    restart: "no"

  # ============================================================================
  # 5. HotelManagementOS Backend API Gateway & AI KYC Controller
  # ============================================================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hotel_pms_api
    restart: always
    environment:
      PORT: 3002
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/hotel_pms
      REDIS_URL: redis://redis:6379
      OLLAMA_HOST: http://ollama:11434
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy

  # ============================================================================
  # 6. HotelManagementOS Frontend SPA (React 19 + TypeScript + Vite + Nginx)
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel_pms_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:3002
    depends_on:
      - server

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
