version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL 16 - Enterprise ACID Relational Database (1NF-4NF, RLS)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: hotel_pms_postgres
    restart: always
    environment:
      POSTGRES_DB: hotel_pms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/database/schema.postgres.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hotel_pms"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Redis 7 - Distributed Redlock & Pub/Sub Multi-Terminal Cluster Bus
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: hotel_pms_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # 3. HotelManagementOS Backend API Gateway & SSE Realtime Broadcaster
  # ============================================================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hotel_pms_api
    restart: always
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/hotel_pms
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # 4. HotelManagementOS Frontend SPA (React 19 + TypeScript + Vite)
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel_pms_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:3001
    depends_on:
      - server

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
