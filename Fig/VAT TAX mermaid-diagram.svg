<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1222.482 581.4680000000001" width="1222.482" height="581.4680000000001" style="--bg:#FFFFFF;--fg:#1E293B;--line:#64748B;--muted:#475569;--surface:#F8FAFC;--border:#CBD5E1;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Change" data-to="Scope" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="606.9802499999998,76.9 606.9802500000001,124.90000000000012" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Scope" data-to="Lock" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="1. Past / Settled / Checked-Out" points="543.17985,273.7676 543.17985,349.568 184.3515,349.568 184.3515,441.86800000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Scope" data-to="AutoNew" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="2. New Bookings (Future)" points="585.71345,316.3012 585.71345,373.568 472.15549999999996,373.568 472.15549999999996,441.86800000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Scope" data-to="MidStay" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="3. In-House / Current Stays" points="628.24705,316.3012 628.24705,373.568 741.8050000000001,373.568 741.8049999999998,441.86800000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Scope" data-to="ScopeModal" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="4. Upcoming Confirmed Bookings" points="670.7806499999999,273.7676 670.7806499999999,349.568 1039.242,349.568 1039.242,441.86800000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Scope" data-to="Lock" data-label="1. Past / Settled / Checked-Out">
  <rect x="108.35149999999999" y="356.568" width="151.894" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="184.2985" y="371.71799999999996" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">1. Past / Settled / Checked-Out</text>
</g>
<g class="edge-label" data-from="Scope" data-to="AutoNew" data-label="2. New Bookings (Future)">
  <rect x="404.65549999999996" y="380.568" width="134.668" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="471.98949999999996" y="395.71799999999996" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">2. New Bookings (Future)</text>
</g>
<g class="edge-label" data-from="Scope" data-to="MidStay" data-label="3. In-House / Current Stays">
  <rect x="670.3050000000001" y="380.568" width="142.39000000000001" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="741.5000000000001" y="395.71799999999996" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">3. In-House / Current Stays</text>
</g>
<g class="edge-label" data-from="Scope" data-to="ScopeModal" data-label="4. Upcoming Confirmed Bookings">
  <rect x="953.742" y="356.568" width="170.30800000000002" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="1038.896" y="371.71799999999996" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">4. Upcoming Confirmed Bookings</text>
</g>
<g class="node" data-id="Change" data-label="Tax / VAT Policy Updated in Settings" data-shape="rectangle">
  <rect x="480.41274999999996" y="40" width="253.13499999999993" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="606.98025" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Tax / VAT Policy Updated in Settings</text>
</g>
<g class="node" data-id="Scope" data-label="Target Reservation State" data-shape="diamond">
  <polygon points="606.98025,124.9 713.3142499999999,231.234 606.98025,337.568 500.64624999999995,231.234" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="606.98025" y="231.234" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Target Reservation State</text>
</g>
<g class="node" data-id="Lock" data-label="IMMUTABLE &amp; AUDIT-LOCKED
(Never changed - legal &amp; fiscal compliance)" data-shape="rectangle">
  <rect x="40" y="441.86800000000005" width="288.703" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="184.3515" y="468.76800000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="184.3515" dy="-3.9000000000000012">IMMUTABLE &amp; AUDIT-LOCKED</tspan><tspan x="184.3515" dy="16.900000000000002">(Never changed - legal &amp; fiscal compliance)</tspan></text>
</g>
<g class="node" data-id="AutoNew" data-label="AUTOMATIC NEW POLICY
(Inherit active Tax Configuration)" data-shape="rectangle">
  <rect x="356.703" y="441.86800000000005" width="230.90499999999994" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="472.15549999999996" y="468.76800000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="472.15549999999996" dy="-3.9000000000000012">AUTOMATIC NEW POLICY</tspan><tspan x="472.15549999999996" dy="16.900000000000002">(Inherit active Tax Configuration)</tspan></text>
</g>
<g class="node" data-id="MidStay" data-label="SPLIT-NIGHT PRINCIPLE
- Completed nights keep Old Rate
- Future nights apply New Rate
- Manual override in Folio if required" data-shape="rectangle">
  <rect x="615.608" y="441.86800000000005" width="252.39399999999998" height="87.60000000000001" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="741.805" y="485.66800000000006" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="741.805" dy="-20.8">SPLIT-NIGHT PRINCIPLE</tspan><tspan x="741.805" dy="16.900000000000002">- Completed nights keep Old Rate</tspan><tspan x="741.805" dy="16.900000000000002">- Future nights apply New Rate</tspan><tspan x="741.805" dy="16.900000000000002">- Manual override in Folio if required</tspan></text>
</g>
<g class="node" data-id="ScopeModal" data-label="TAX PROPAGATION POLICY DIALOG
Option A: Keep Contracted Tax (Locked)
Option B: Recalculate to New Statutory Tax" data-shape="rectangle">
  <rect x="896.002" y="441.86800000000005" width="286.47999999999996" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1039.242" y="477.2180000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="1039.242" dy="-12.350000000000001">TAX PROPAGATION POLICY DIALOG</tspan><tspan x="1039.242" dy="16.900000000000002">Option A: Keep Contracted Tax (Locked)</tspan><tspan x="1039.242" dy="16.900000000000002">Option B: Recalculate to New Statutory Tax</tspan></text>
</g>
</svg>